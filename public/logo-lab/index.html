<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<meta name=robots content="noindex,nofollow"><title>Logo lab · Nicholas</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Allura&family=Caveat:wght@600&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet">
<style>
:root{--a:#A9D18E;--ink:#0D1014;--tx:#F3EFE6;--mu:#8A94A0;--bd:#3A424C;--card:#12161B}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--tx);font-family:'IBM Plex Mono',monospace}
header{padding:40px 32px 8px;max-width:1240px;margin:auto;display:flex;gap:16px;align-items:end;flex-wrap:wrap}
h1{font-family:Archivo;font-stretch:125%;font-weight:800;font-size:28px;margin:0}
header p{color:var(--mu);font-size:13px;margin:6px 0 0}
.ctl{margin-left:auto;display:flex;gap:8px;align-items:center}
button{background:transparent;color:var(--tx);border:1px solid var(--bd);font:inherit;font-size:12px;padding:8px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--a)}button.sw{width:30px;height:30px;padding:0;border-radius:50%}
main{max-width:1240px;margin:auto;padding:24px 32px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:18px}
.c{background:var(--card);border:1px solid #20262d;border-radius:14px;overflow:hidden;position:relative}
.num{position:absolute;top:14px;left:16px;font-family:Archivo;font-stretch:125%;font-weight:800;font-size:22px;color:var(--a)}
.stage{height:190px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.zoom{transform:scale(var(--z,2));transform-origin:center}
.bar{height:62px;display:flex;align-items:center;padding:0 18px;border-top:1px solid #20262d;background:var(--ink)}
.bar nav{margin-left:auto;color:var(--mu);font-size:11px;display:flex;gap:14px}
.meta{display:flex;align-items:center;padding:10px 18px;border-top:1px solid #20262d;font-size:12px;color:var(--mu)}
.meta b{color:var(--tx);margin-right:8px}.meta button{margin-left:auto}
.card{display:none}

.bar .l06{width:50px;height:50px}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fin{to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.4)}100%{opacity:1;transform:scale(1)}}
.W{font-family:Archivo;font-stretch:125%;font-weight:800;fill:var(--tx)}
svg *{transform-box:fill-box}
/* 01 */.l01 text{font-family:Allura;font-size:42px;fill:transparent;stroke:var(--tx);stroke-width:.8;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.6s .1s ease-in-out forwards,fillin .5s 1.4s forwards}
.l01 .sw{fill:none;stroke:var(--a);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:160;stroke-dashoffset:160;animation:draw .6s 1.5s ease-out forwards}
@keyframes fillin{to{fill:var(--tx);stroke-width:0}}
/* 02 */.l02 .w{font-family:Archivo;font-stretch:125%;font-weight:800;font-size:22px;fill:var(--tx)}
.l02 .l{opacity:0;animation:up .45s cubic-bezier(.2,.8,.2,1) forwards}
.l02 .o{fill:var(--a);transform-origin:center;animation:roll .9s .55s cubic-bezier(.3,1.4,.5,1) both}
@keyframes roll{from{transform:translateX(-60px) scale(.4);opacity:0}to{transform:none;opacity:1}}
/* 03 */.l03 .t{font-family:Archivo;font-weight:800;font-size:17px;fill:var(--tx);letter-spacing:.5px}
.l03 .t1{opacity:0;animation:up .5s .1s forwards}.l03 .t2{opacity:0;animation:up .5s .35s forwards}
.l03 .br{fill:none;stroke:var(--a);stroke-width:4;stroke-linecap:round;stroke-dasharray:90;stroke-dashoffset:90;animation:draw .5s .8s ease-out forwards}
/* 04 */.l04 text{font-family:'Instrument Serif';font-style:italic;font-size:30px;fill:var(--tx)}
.l04 tspan{opacity:0;animation:fin .5s forwards}.l04 .per{fill:var(--a);font-style:normal}
/* 05 */.l05 .w{font-family:Archivo;font-stretch:125%;font-weight:800;font-size:26px;fill:var(--tx)}
.l05 .d{fill:var(--a);animation:bounce 1s .3s both}
@keyframes bounce{0%{transform:translateY(-40px);opacity:0}10%{opacity:1}40%{transform:translateY(0)}55%{transform:translateY(-9px)}70%{transform:translateY(0)}82%{transform:translateY(-3px)}100%{transform:translateY(0);opacity:1}}
/* 06 */.l06 .ring text{font-size:7.6px;letter-spacing:1.1px;fill:var(--tx);font-family:'IBM Plex Mono'}
.l06 .ring{transform-origin:center;transform-box:view-box;animation:spin 1.8s cubic-bezier(.2,.7,.2,1) both}
@keyframes spin{from{transform:rotate(-200deg);opacity:0}to{transform:none;opacity:1}}
.l06 .core{fill:var(--a);transform-origin:center;animation:pop .5s .6s both}.l06 .mid{font-family:'Instrument Serif';font-style:italic;font-size:17px;fill:var(--ink);opacity:0;animation:fin .3s 1s forwards}
/* 07 */.l07 .w{font-family:Archivo;font-stretch:125%;font-weight:800;font-size:24px;fill:var(--tx)}
.l07 .wv{fill:none;stroke:var(--a);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:220;stroke-dashoffset:220;animation:draw 1s .3s ease-out forwards}
/* 08 */.l08 .w{font-family:Archivo;font-stretch:125%;font-weight:800;font-size:19px;fill:var(--tx);animation:toink .3s .55s forwards}
.l08 .hl{fill:var(--a);transform-origin:left;animation:sweep .6s .2s cubic-bezier(.7,0,.2,1) both}
@keyframes sweep{from{transform:scaleX(0)}to{transform:none}}@keyframes toink{to{fill:var(--ink)}}
/* 09 */.l09 .w{font-family:Archivo;font-stretch:125%;font-weight:800;font-size:24px;fill:var(--tx)}
.l09 .a{animation:fl .8s cubic-bezier(.2,.8,.2,1) both}.l09 .b{animation:fr .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes fl{from{transform:translateX(-40px);opacity:0}}@keyframes fr{from{transform:translateX(40px);opacity:0}}
.l09 .ln{fill:var(--a);transform-origin:left;animation:sweep .5s .7s both}
/* 10 */.l10 .tile rect{fill:var(--a)}.l10 .tile text{font-family:Archivo;font-weight:800;font-size:19px;fill:var(--ink)}
.l10 .tile{transform-origin:center;animation:tilein .7s cubic-bezier(.3,1.4,.5,1) both}
@keyframes tilein{from{transform:rotate(-90deg) scale(.3);opacity:0}}
.l10 .w{font-family:Archivo;font-stretch:125%;font-weight:800;font-size:17px;fill:var(--tx);animation:sl .6s .45s both}
@keyframes sl{from{opacity:0;transform:translateX(-14px)}}
/* 11 */.l11 .q{font-family:'Instrument Serif';font-size:54px;fill:var(--a)}.l11 .q1{transform-origin:right bottom;animation:sw1 .7s .1s cubic-bezier(.3,1.5,.5,1) both}.l11 .q2{transform-origin:left bottom;animation:sw2 .7s .35s cubic-bezier(.3,1.5,.5,1) both}
@keyframes sw1{from{transform:rotate(-60deg);opacity:0}}@keyframes sw2{from{transform:rotate(60deg);opacity:0}}
.l11 .nm{font-family:'Instrument Serif';font-size:32px;fill:var(--tx);animation:fin .6s .5s both;opacity:0}
/* 12 */.l12 .w{font-family:Archivo;font-stretch:125%;font-weight:800;font-size:18px;fill:var(--tx)}
.l12 .cir{fill:none;stroke:var(--a);stroke-width:2;stroke-linecap:round;stroke-dasharray:260;stroke-dashoffset:260;animation:draw .9s .4s ease-in-out forwards}
/* 13 */.l13{display:inline-block;font-family:Archivo;font-weight:800;font-size:17px;color:var(--tx);white-space:nowrap}.l13 .t,.l13 .t2{display:inline-block;animation:track 1.1s cubic-bezier(.2,.8,.2,1) both}.l13 .t2{color:var(--a);margin-left:.4em}
@keyframes track{from{letter-spacing:14px;opacity:0;filter:blur(3px)}to{letter-spacing:1px;opacity:1;filter:none}}
/* 14 */.l14 .w{font-family:Archivo;font-stretch:125%;font-weight:800;font-size:24px;fill:var(--tx)}
.l14 .sp{fill:var(--a);transform-origin:center;animation:twinkle .9s .5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes twinkle{from{transform:scale(0) rotate(-180deg)}to{transform:none}}
/* 15 */.l15 .w{font-family:Archivo;font-stretch:125%;font-weight:800;font-size:24px;fill:var(--tx)}
.l15 .ar path{fill:none;stroke:var(--a);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.l15 .ar{animation:arr .8s .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes arr{0%{transform:translateX(var(--ax)) translateX(-24px);opacity:0}100%{transform:translateX(var(--ax));opacity:1}}
/* 16 */.l16 text{font-family:Caveat;font-weight:600;font-size:36px;fill:transparent;stroke:var(--a);stroke-width:.9;stroke-dasharray:700;stroke-dashoffset:700;animation:draw 1.5s .1s ease-in-out forwards,fill2 .5s 1.3s forwards}
@keyframes fill2{to{fill:var(--tx);stroke-width:0}}
/* 17 */.l17 .n{fill:none;stroke:var(--a);stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;stroke-dashoffset:70;animation:draw .7s .1s ease-in-out forwards}
.l17 .w{font-family:Archivo;font-stretch:125%;font-weight:800;font-size:24px;fill:var(--tx);animation:sl .5s .7s both}
/* 18 */.l18 .w{font-family:Archivo;font-stretch:125%;font-weight:800;font-size:24px;fill:var(--tx);animation:fin .4s both;opacity:0}
.l18 .sm{fill:none;stroke:var(--a);stroke-width:2.8;stroke-linecap:round;stroke-dasharray:120;stroke-dashoffset:120;animation:draw .6s .5s ease-out forwards}
/* 19 */.l19{display:inline-block;font-family:Archivo;font-size:28px;color:var(--tx);animation:wm 1.2s cubic-bezier(.2,.8,.2,1) both;letter-spacing:-.3px}.l19 span{color:var(--a)}
@keyframes wm{from{font-weight:100;opacity:.2}to{font-weight:800;opacity:1}}
/* 20 */.l20 .s{font-family:'Instrument Serif';font-size:34px;fill:var(--tx)}.l20 .n{animation:fin .5s both;opacity:0}.l20 .p{fill:var(--a);animation:fin .2s .45s both;opacity:0}.l20 .c{opacity:0;animation:fin .6s .65s forwards}

</style></head><body>
<header><div><h1>Logo lab · 20</h1><p>Each logo plays once on load. Click a logo or Replay to watch it again. Pick by number.</p></div>
<div class=ctl><button class=sw data-c="#A9D18E" style="background:#A9D18E" title="sage"></button><button class=sw data-c="#F0A97A" style="background:#F0A97A" title="apricot"></button><button id=all>Replay all</button></div></header>
<main id=m></main>
<div id=src><div class=card data-i="01" data-n="Signature"><svg viewBox="0 0 200 60" width=200 height=60 class=l01><text x=2 y=40>Nicholas</text><path class=sw d="M20 50 C60 44 110 44 150 48"/></svg></div>
<div class=card data-i="02" data-n="Rolling o"><svg viewBox="0 0 200 44" width=200 height=44 class=l02><text class=w y=30><tspan class="l p1" x=0>nich</tspan></text><circle class=o cx=0 cy=22.5 r=8 /><text class=w y=30><tspan class="l p2" style="animation-delay:.15s">las</tspan></text></svg></div>
<div class=card data-i="03" data-n="Stacked name"><svg viewBox="0 0 120 56" width=120 height=56 class=l03><path class=br d="M3 49 H70"/><text class="t t1" x=2 y=20>NICHOLAS</text><text class="t t2" x=2 y=42>CHONG</text></svg></div>
<div class=card data-i="04" data-n="Serif cascade"><svg viewBox="0 0 220 44" width=220 height=44 class=l04><text x=0 y=31><tspan style="animation-delay:0.00s">N</tspan><tspan style="animation-delay:0.05s">i</tspan><tspan style="animation-delay:0.10s">c</tspan><tspan style="animation-delay:0.15s">h</tspan><tspan style="animation-delay:0.20s">o</tspan><tspan style="animation-delay:0.25s">l</tspan><tspan style="animation-delay:0.30s">a</tspan><tspan style="animation-delay:0.35s">s</tspan><tspan style="animation-delay:0.40s">&#160;</tspan><tspan style="animation-delay:0.45s">C</tspan><tspan style="animation-delay:0.50s">h</tspan><tspan style="animation-delay:0.55s">o</tspan><tspan style="animation-delay:0.60s">n</tspan><tspan style="animation-delay:0.65s">g</tspan><tspan class=per style="animation-delay:.85s">.</tspan></text></svg></div>
<div class=card data-i="05" data-n="Bouncing i-dot"><svg viewBox="0 0 170 50" width=170 height=50 class=l05><text class=w x=0 y=38>n&#305;cholas</text><circle class=d r=4.2 cx=20 cy=17 /></svg></div>
<div class=card data-i="06" data-n="Spinning seal"><svg viewBox="0 0 64 64" width=64 height=64 class=l06><defs><path id=cp d="M32 32 m-24 0 a24 24 0 1 1 48 0 a24 24 0 1 1 -48 0"/></defs><g class=ring><text><textPath href="#cp">NICHOLAS CHONG · NICHOLAS CHONG ·</textPath></text></g><circle cx=32 cy=32 r=15 class=core /><text class=mid x=32 y=38 text-anchor=middle>nc</text></svg></div>
<div class=card data-i="07" data-n="Wave underline"><svg viewBox="0 0 170 52" width=170 height=52 class=l07><text class=w x=0 y=28>Nicholas</text><path class=wv d="M2 42 q8 -7 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0"/></svg></div>
<div class=card data-i="08" data-n="Marker chip"><svg viewBox="0 0 230 44" width=230 height=44 class=l08><rect class=hl x=0 y=7 width=10 height=30 rx=4 /><text class=w x=10 y=29>Nicholas Chong</text></svg></div>
<div class=card data-i="09" data-n="Split slide"><svg viewBox="0 0 180 44" width=180 height=44 class=l09><defs><clipPath id=top><rect x=0 y=0 width=200 height=22 /></clipPath><clipPath id=bot><rect x=0 y=22 width=200 height=22 /></clipPath></defs><text class="w a" x=0 y=31 clip-path="url(#top)">Nicholas</text><text class="w b" x=0 y=31 clip-path="url(#bot)">Nicholas</text></svg></div>
<div class=card data-i="10" data-n="Tile + name"><svg viewBox="0 0 220 44" width=220 height=44 class=l10><g class=tile><rect x=2 y=6 width=32 height=32 rx=9 /><text x=18 y=29 text-anchor=middle>N</text></g><text class=w x=46 y=29>Nicholas Chong</text></svg></div>
<div class=card data-i="11" data-n="Quote marks"><svg viewBox="0 0 200 50" width=200 height=50 class=l11><text class="q q1" x=0 y=40>&#8220;</text><text class=nm x=22 y=34>Nicholas</text><text class="q q2" x=130 y=40>&#8221;</text></svg></div>
<div class=card data-i="12" data-n="Hand-drawn circle"><svg viewBox="0 0 230 50" width=230 height=50 class=l12><text class=w x=10 y=32>Nicholas Chong</text><path class=cir d=""/></svg></div>
<div class=card data-i="13" data-n="Tracking in"><div class=l13><span class=t>NICHOLAS</span><span class=t2>CHONG</span></div></div>
<div class=card data-i="14" data-n="Sparkle"><svg viewBox="0 0 180 44" width=180 height=44 class=l14><text class=w x=0 y=30>Nicholas</text><g class=spg><path class=sp d="M0 -9 C1 -2 2 -1 9 0 C2 1 1 2 0 9 C-1 2 -2 1 -9 0 C-2 -1 -1 -2 0 -9Z"/></g></svg></div>
<div class=card data-i="15" data-n="Arrow out"><svg viewBox="0 0 190 44" width=190 height=44 class=l15><text class=w x=0 y=29>nicholas</text><g class=ar><path d="M0 0 H22 M15 -7 L22 0 L15 7"/></g></svg></div>
<div class=card data-i="16" data-n="Handwritten"><svg viewBox="0 0 170 54" width=170 height=54 class=l16><text x=2 y=38>Nic Chong</text></svg></div>
<div class=card data-i="17" data-n="One-stroke N"><svg viewBox="0 0 170 44" width=170 height=44 class=l17><path class=n d="M2 30 V13 L15 30 V13"/><text class=w x=19 y=30>icholas</text></svg></div>
<div class=card data-i="18" data-n="Smile"><svg viewBox="0 0 170 50" width=170 height=50 class=l18><text class=w x=0 y=28>nicholas</text><path class=sm d=""/></svg></div>
<div class=card data-i="19" data-n="Weight morph"><div class=l19>Nicholas<span>.</span></div></div>
<div class=card data-i="20" data-n="N. Chong"><svg viewBox="0 0 170 48" width=170 height=48 class=l20><text class=s x=0 y=34><tspan class=n>N</tspan><tspan class=p>.</tspan><tspan class=c dx=6>Chong</tspan></text></svg></div></div>
<script>
let uid=0;
function uniq(el){const ids=[...el.querySelectorAll('[id]')];let h=el.innerHTML;ids.forEach(e=>{const o=e.id,n=o+'_'+(++uid);h=h.split('id="'+o+'"').join('id="'+n+'"').split('id='+o+' ').join('id="'+n+'" ').split('id='+o+'>').join('id="'+n+'">').split('#'+o+')').join('#'+n+')').split('"#'+o+'"').join('"#'+n+'"')});el.innerHTML=h}
function fit(r){
 const q=s=>r.querySelector(s);
 if(q('.l02')){const w=q('.l02 .p1').getComputedTextLength();q('.l02 .o').setAttribute('cx',w+10.5);q('.l02 .p2').setAttribute('x',w+21);}
 if(q('.l03')){q('.l03 .br').setAttribute('d',`M3 49 H${q('.l03 .t2').getComputedTextLength()}`);}
 if(q('.l05')){const t=q('.l05 .w'),e=t.getExtentOfChar(1);q('.l05 .d').setAttribute('cx',e.x+e.width/2);q('.l05 .d').setAttribute('cy',e.y+e.height*0.2);}
 if(q('.l08')){const w=q('.l08 .w').getComputedTextLength();q('.l08 .hl').setAttribute('width',w+20);}
 if(q('.l11')){const bb=q('.l11 .nm').getBBox();q('.l11 .q2').setAttribute('x',bb.x+bb.width+3);}
 if(q('.l12')){const t=q('.l12 .w'),w=t.getSubStringLength(0,3),x=10,cx=x+w/2,rx=w/2+9;q('.l12 .cir').setAttribute('d',`M${cx-rx+3} 16 C${cx-rx-6} 30 ${cx-6} 44 ${cx+rx} 34 C${cx+rx+10} 26 ${cx+rx-4} 8 ${cx-4} 10 C${cx-rx+6} 11 ${cx-rx-2} 20 ${cx-rx+2} 26`);}
 if(q('.l14')){const w=q('.l14 .w').getComputedTextLength();q('.l14 .spg').setAttribute('transform',`translate(${w+12} 10)`);}
 if(q('.l15')){const w=q('.l15 .w').getComputedTextLength();q('.l15 .ar').style.setProperty('--ax',(w+8)+'px');q('.l15 .ar').setAttribute('transform-origin','0 0');q('.l15 .ar path').setAttribute('transform','translate(0 22)');}
 if(q('.l18')){const t=q('.l18 .w'),a=t.getExtentOfChar(2),b=t.getExtentOfChar(5);q('.l18 .sm').setAttribute('d',`M${a.x} 36 Q${(a.x+b.x+b.width)/2} 48 ${b.x+b.width} 36`);}
}
function replay(el){el.getAnimations({subtree:true}).forEach(a=>{a.cancel();a.play()})}
Promise.all(['800 24px Archivo','24px Allura','600 24px Caveat','24px "Instrument Serif"','italic 24px "Instrument Serif"','500 12px "IBM Plex Mono"'].map(f=>document.fonts.load(f))).then(()=>document.fonts.ready).then(()=>{
 const m=document.getElementById('m');
 document.querySelectorAll('#src .card').forEach(s=>{
  const c=document.createElement('div');c.className='c';
  c.innerHTML=`<div class=num>${s.dataset.i}</div><div class=stage><div class=zoom></div></div><div class=bar><nav><span>Work</span><span>About</span><span>Contact</span></nav></div><div class=meta><b>${s.dataset.i}</b>${s.dataset.n}<button>Replay</button></div>`;
  const z=c.querySelector('.zoom'),b=c.querySelector('.bar');
  z.innerHTML=s.innerHTML;b.insertAdjacentHTML('afterbegin',s.innerHTML);
  m.append(c);uniq(z);uniq(b);fit(z);fit(b);
  z.style.setProperty('--z',1);z.getAnimations({subtree:true}).forEach(a=>a.finish());const w=z.firstElementChild.getBoundingClientRect().width;z.style.setProperty('--z',Math.min(2.2,300/w));
  const r=()=>replay(c);c.querySelector('.stage').onclick=r;c.querySelector('.meta button').onclick=r;
 });
 document.getElementById('src').remove();replay(m);document.body.dataset.ok=1;
});
document.getElementById('all').onclick=()=>replay(document.getElementById('m'));
document.querySelectorAll('.sw[data-c]').forEach(b=>b.onclick=()=>document.documentElement.style.setProperty('--a',b.dataset.c));
</script></body></html>
