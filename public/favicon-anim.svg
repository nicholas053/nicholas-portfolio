      <rect x="2" y="11" width="2" height="1" fill="#F3EFE6"/>
      <rect x="7" y="11" width="2" height="1" fill="#F3EFE6"/>
      <rect x="2" y="12" width="2" height="1" fill="#F3EFE6"/>
      <rect x="7" y="12" width="2" height="1" fill="#F3EFE6"/>
      </g>
      <g class="pulse" shape-rendering="crispEdges">
      <rect x="10" y="3" width="4" height="1" fill="#A9D18E"/>
      <rect x="10" y="4" width="2" height="1" fill="#A9D18E"/>
      <rect x="13" y="4" width="2" height="1" fill="#A9D18E"/>
      <rect x="10" y="5" width="2" height="1" fill="#A9D18E"/>
