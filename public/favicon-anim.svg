<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Nicholas Chong NC ligature animated">
  <title>Nicholas Chong NC ligature animated</title>
  <style>
    .lo { display: none; }
    @media (max-width: 24px) {
      .hi { display: none; }
      .lo { display: block; }
    }
    .pulse { animation: cpulse 3s ease-in-out infinite; }
    @keyframes cpulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none !important; }
    }
  </style>
  <g class="hi">
    <rect x="1" y="1" width="30" height="30" rx="8" fill="#0D1014" stroke="#3A424C" stroke-width="2"/>
    <path fill="#F3EFE6" d="M5.2 8.4 H8.7 L13.0 18.8 V8.4 H16.5 V23.6 H13.0 L8.7 13.2 V23.6 H5.2 Z"/>
  <path class="pulse" fill="none" stroke="#A9D18E" stroke-width="3.1" stroke-linecap="round" d="M25.5 11.25 A6.2 6.2 0 1 0 25.5 20.75"/>
  </g>
  <g class="lo">
    <g transform="scale(2)">
      <rect x="0.5" y="0.5" width="15" height="15" rx="4" fill="#0D1014" stroke="#3A424C" stroke-width="1"/>
      <g shape-rendering="crispEdges">
      <rect x="2" y="3" width="4" height="1" fill="#F3EFE6"/>
