      <rect x="2" y="5" width="2" height="1" fill="#F3EFE6"/>
      <rect x="5" y="5" width="4" height="1" fill="#F3EFE6"/>
      <rect x="2" y="6" width="2" height="1" fill="#F3EFE6"/>
      <rect x="5" y="6" width="4" height="1" fill="#F3EFE6"/>
      <rect x="2" y="7" width="2" height="1" fill="#F3EFE6"/>
      <rect x="6" y="7" width="3" height="1" fill="#F3EFE6"/>
      <rect x="2" y="8" width="2" height="1" fill="#F3EFE6"/>
      <rect x="6" y="8" width="3" height="1" fill="#F3EFE6"/>
      <rect x="2" y="9" width="2" height="1" fill="#F3EFE6"/>
      <rect x="7" y="9" width="2" height="1" fill="#F3EFE6"/>
      <rect x="2" y="10" width="2" height="1" fill="#F3EFE6"/>
