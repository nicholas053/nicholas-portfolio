<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<meta name=robots content="noindex,nofollow"><title>Logo lab · Nicholas</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,800;125,800&family=Allura&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet">
<style>
:root{--a:#A9D18E;--ink:#0D1014;--tx:#F3EFE6;--mu:#8A94A0;--bd:#3A424C;--card:#12161B}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--tx);font-family:'IBM Plex Mono',monospace}
header{padding:40px 32px 8px;max-width:1100px;margin:auto;display:flex;gap:16px;align-items:end;flex-wrap:wrap}
h1{font-family:Archivo;font-stretch:125%;font-weight:800;font-size:28px;margin:0}
header p{color:var(--mu);font-size:13px;margin:6px 0 0}
.ctl{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
button{background:transparent;color:var(--tx);border:1px solid var(--bd);font:inherit;font-size:12px;padding:8px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--a)}button.sw{width:30px;height:30px;padding:0;border-radius:50%}
main{max-width:1100px;margin:auto;padding:24px 32px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(460px,100%),1fr));gap:20px}
.card{background:var(--card);border:1px solid #20262d;border-radius:14px;overflow:hidden}
.stage{height:220px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.stage svg{max-width:88%;height:auto}
.bar{height:64px;display:flex;align-items:center;padding:0 20px;border-top:1px solid #20262d;background:var(--ink)}
.bar nav{margin-left:auto;color:var(--mu);font-size:12px;display:flex;gap:18px}
.meta{display:flex;align-items:center;padding:12px 20px;border-top:1px solid #20262d;font-size:12px;color:var(--mu)}
.meta b{color:var(--tx);margin-right:8px}.meta button{margin-left:auto}
.tag{font-size:10px;border:1px solid var(--bd);border-radius:99px;padding:2px 8px;margin-left:8px}
/* A */
.A .wm{font-family:Archivo;font-stretch:125%;font-weight:800;font-size:24px;fill:var(--tx)}
.A .line{fill:none;stroke:var(--bd);stroke-width:2;stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1s .2s ease-out forwards}
.A .dot{fill:var(--a);animation:run 1.2s .2s cubic-bezier(.6,0,.3,1) forwards}
.A .per{fill:var(--a);opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .3s 1.35s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes run{0%{offset-distance:0%}100%{offset-distance:100%;opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{transform:scale(1.4)}100%{opacity:1;transform:scale(1)}}
/* B */
.B .n{fill:var(--ink);stroke:var(--mu);stroke-width:2;animation:lit 1.8s forwards}
.B .n2{animation-delay:.35s}.B .n3{animation-delay:.7s}
@keyframes lit{0%{stroke:var(--mu)}30%,100%{stroke:var(--a)}}
.B .loop{fill:none;stroke:var(--a);stroke-width:2;stroke-dasharray:70;stroke-dashoffset:70;animation:draw .6s 1.1s ease-out forwards}
.B .t{font-family:Archivo;font-stretch:125%;font-weight:800;font-size:17px;fill:var(--tx)}
.B .s{font-size:10px;fill:var(--mu);letter-spacing:1px}
/* C */
.C .t{font-size:19px;fill:var(--tx)}.C .pr{fill:var(--a)}
.C .ch{opacity:0;animation:show 0s forwards}
.C .cur{fill:var(--a);animation:mv 1.2s steps(8) .2s forwards,blink 1s 1.6s step-end 3 forwards}
@keyframes show{to{opacity:1}}@keyframes mv{to{transform:translateX(91px)}}@keyframes blink{50%{opacity:0}}
/* D */
.D text{font-family:Allura;font-size:42px;fill:transparent;stroke:var(--tx);stroke-width:.8;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.6s .1s ease-in-out forwards,fillin .5s 1.4s forwards}
.D .sw{fill:none;stroke:var(--a);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:160;stroke-dashoffset:160;animation:draw .6s 1.5s ease-out forwards}
@keyframes fillin{to{fill:var(--tx);stroke-width:0}}
/* E */
.E .w{font-family:Archivo;font-stretch:125%;font-weight:800;font-size:22px;fill:var(--tx)}
.E .l{opacity:0;animation:up .45s cubic-bezier(.2,.8,.2,1) forwards}
.E .o{fill:var(--a);transform-box:fill-box;transform-origin:center;animation:roll .9s .55s cubic-bezier(.3,1.4,.5,1) both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes roll{from{transform:translateX(-60px) scale(.4);opacity:0}to{transform:none;opacity:1}}
/* F */
.F .t{font-family:Archivo;font-weight:800;font-size:17px;fill:var(--tx);letter-spacing:.5px}
.F .t1{opacity:0;animation:up .5s .1s forwards}.F .t2{opacity:0;animation:up .5s .35s forwards}
.F .br{fill:none;stroke:var(--a);stroke-width:4;stroke-linecap:round;stroke-dasharray:90;stroke-dashoffset:90;animation:draw .5s .8s ease-out forwards}
@media(max-width:560px){main{grid-template-columns:1fr;padding:16px}}
</style></head><body>
<header><div><h1>Logo lab</h1><p>Click a logo or Replay to watch its animation again. Colour follows the swatch.</p></div>
<div class=ctl><button class=sw data-c="#A9D18E" style="background:#A9D18E" title="sage"></button><button class=sw data-c="#F0A97A" style="background:#F0A97A" title="apricot"></button><button id=all>Replay all</button></div></header>
<main id=m></main>
<template id=logos>
<svg data-k=D data-n="Signature" data-tag=new width=200 height=60 viewBox="0 0 200 60" class=D><text x=2 y=40>Nicholas</text><path class=sw d="M20 50 C60 44 110 44 150 48"/></svg>
<svg data-k=E data-n="Rolling o" data-tag=new width=200 height=44 viewBox="0 0 200 44" class=E><text class=w y=30><tspan class="l p1" x=0>nich</tspan></text><circle class=o cx=0 cy=22.5 r=8 /><text class=w y=30><tspan class="l p2" style="animation-delay:.15s">las</tspan></text></svg>
<svg data-k=F data-n="Stacked name" data-tag=new width=120 height=56 viewBox="0 0 120 56" class=F><path class=br d="M3 49 H70"/><text class="t t1" x=2 y=20>NICHOLAS</text><text class="t t2" x=2 y=42>CHONG</text></svg>
<svg data-k=A data-n="Trace wordmark" data-tag="earlier · IT" width=170 height=44 viewBox="0 0 170 44" class=A><text class=wm x=0 y=28>nicholas</text><path class=line d="M2 36 H152 V30"/><circle class=per cx=160 cy=25.5 r=3.6 /><circle class=dot r=3.5 /></svg>
<svg data-k=B data-n="Callback loop" data-tag="earlier · IT" width=250 height=44 viewBox="0 0 250 44" class=B><g transform="translate(0,6)"><path d="M6 14 H46" stroke=#3A424C stroke-width=2 /><path class=loop d="M46 14 C46 34 6 34 6 14"/><circle class=n cx=6 cy=14 r=5 /><circle class="n n2" cx=26 cy=14 r=5 /><circle class="n n3" cx=46 cy=14 r=5 /></g><text class=t x=64 y=22>Nicholas Chong</text><text class=s x=64 y=37>FULL-STACK · PRODUCT</text></svg>
<svg data-k=C data-n="Terminal prompt" data-tag="earlier · IT" width=150 height=44 viewBox="0 0 150 44" class=C><text class=t x=0 y=28><tspan class=pr>~$ </tspan><tspan class=ch style="animation-delay:.35s">n</tspan><tspan class=ch style="animation-delay:.5s">i</tspan><tspan class=ch style="animation-delay:.65s">c</tspan><tspan class=ch style="animation-delay:.8s">h</tspan><tspan class=ch style="animation-delay:.95s">o</tspan><tspan class=ch style="animation-delay:1.1s">l</tspan><tspan class=ch style="animation-delay:1.25s">a</tspan><tspan class=ch style="animation-delay:1.4s">s</tspan></text><rect class=cur x=36 y=12 width=10 height=20 /></svg>
</template>
<script>
const m=document.getElementById('m');
document.fonts.ready.then(()=>{
[...document.getElementById('logos').content.children].forEach(s=>{
 const c=document.createElement('div');c.className='card';
 c.innerHTML=`<div class=stage></div><div class=bar></div><div class=meta><b>${s.dataset.k}</b>${s.dataset.n}<span class=tag>${s.dataset.tag}</span><button>Replay</button></div>`;
 const big=s.cloneNode(true),small=s.cloneNode(true);
 const k=Math.min(2.2,400/+s.getAttribute('width'));big.setAttribute('width',s.getAttribute('width')*k);big.setAttribute('height',s.getAttribute('height')*k);c.querySelector('.stage').append(big);c.querySelector('.bar').append(small);
 c.querySelector('.bar').insertAdjacentHTML('beforeend','<nav><span>Work</span><span>About</span><span>Contact</span></nav>');
 m.append(c);[big,small].forEach(fit);
 const r=()=>c.querySelectorAll('svg').forEach(replay);
 c.querySelector('.stage').onclick=r;c.querySelector('.meta button').onclick=r;});
document.querySelectorAll('svg').forEach(replay);});
function fit(s){
 if(s.classList.contains('A')){const w=s.querySelector('.wm').getBBox().width+5,d=`M2 36 H${w} V30`;s.querySelector('.line').setAttribute('d',d);s.querySelector('.dot').style.offsetPath=`path('${d}')`;const p=s.querySelector('.per');p.setAttribute('cx',w);}
 if(s.classList.contains('E')){const w=s.querySelector('.p1').getComputedTextLength();s.querySelector('.o').setAttribute('cx',w+10.5);s.querySelector('.p2').setAttribute('x',w+21);}
 if(s.classList.contains('F')){s.querySelector('.br').setAttribute('d',`M3 49 H${s.querySelector('.t2').getComputedTextLength()}`);}
}
function replay(s){s.getAnimations({subtree:true}).forEach(a=>{a.cancel();a.play()})}
document.getElementById('all').onclick=()=>document.querySelectorAll('main svg').forEach(replay);
document.querySelectorAll('.sw[data-c]').forEach(b=>b.onclick=()=>document.documentElement.style.setProperty('--a',b.dataset.c));
</script></body></html>
