<script>
let uid=0;
function uniq(el){const ids=[...el.querySelectorAll('[id]')];let h=el.innerHTML;ids.forEach(e=>{const o=e.id,n=o+'_'+(++uid);h=h.split('id="'+o+'"').join('id="'+n+'"').split('id='+o+' ').join('id="'+n+'" ').split('id='+o+'>').join('id="'+n+'">').split('#'+o+')').join('#'+n+')').split('"#'+o+'"').join('"#'+n+'"')});el.innerHTML=h}
function fit(r){
 const q=s=>r.querySelector(s);
 if(q('.l02')){const w=q('.l02 .p1').getComputedTextLength();q('.l02 .o').setAttribute('cx',w+10.5);q('.l02 .p2').setAttribute('x',w+21);}
 if(q('.l03')){q('.l03 .br').setAttribute('d',`M3 49 H${q('.l03 .t2').getComputedTextLength()}`);}
 if(q('.l05')){const t=q('.l05 .w'),e=t.getExtentOfChar(1);q('.l05 .d').setAttribute('cx',e.x+e.width/2);q('.l05 .d').setAttribute('cy',e.y+e.height*0.2);}
 if(q('.l08')){const w=q('.l08 .w').getComputedTextLength();q('.l08 .hl').setAttribute('width',w+20);}
 if(q('.l11')){const bb=q('.l11 .nm').getBBox();q('.l11 .q2').setAttribute('x',bb.x+bb.width+3);}
 if(q('.l12')){const t=q('.l12 .w'),w=t.getSubStringLength(0,3),x=10,cx=x+w/2,rx=w/2+9;q('.l12 .cir').setAttribute('d',`M${cx-rx+3} 16 C${cx-rx-6} 30 ${cx-6} 44 ${cx+rx} 34 C${cx+rx+10} 26 ${cx+rx-4} 8 ${cx-4} 10 C${cx-rx+6} 11 ${cx-rx-2} 20 ${cx-rx+2} 26`);}
 if(q('.l14')){const w=q('.l14 .w').getComputedTextLength();q('.l14 .spg').setAttribute('transform',`translate(${w+12} 10)`);}
 if(q('.l15')){const w=q('.l15 .w').getComputedTextLength();q('.l15 .ar').style.setProperty('--ax',(w+8)+'px');q('.l15 .ar').setAttribute('transform-origin','0 0');q('.l15 .ar path').setAttribute('transform','translate(0 22)');}

 if(q('.l21')){const t=q('.l21 text'),b=t.getBBox(),e=t.getExtentOfChar(7);q('.l21 .sw').setAttribute('d',`M${e.x+e.width*0.6} ${b.y+b.height-6} C${e.x+20} 50 ${b.x+40} 52 ${b.x+6} 46`);}
 if(q('.l30')){const w=q('.l30 .a').getComputedTextLength();q('.l30 .s').setAttribute('d',`M${w+8} 36 L${w+18} 10`);q('.l30 .b').setAttribute('x',w+26);}
 if(q('.l31')){const w=q('.l31 text').getComputedTextLength();q('.l31 .d').setAttribute('cx',w+6);}
 if(q('.l32')){const t=q('.l32 .a'),w=t.getComputedTextLength(),x=w+3;q('.l32 .lp').setAttribute('d',`M${x} 32 C${x+2} 22 ${x+2} 10 ${x+6} 8 C${x+11} 6 ${x+11} 16 ${x+5} 22 C${x+2} 27 ${x+4} 32 ${x+10} 32`);q('.l32 .b').setAttribute('x',x+13);}
 if(q('.l40')){const w=q('.l40 text').getComputedTextLength();['.d1','.d2','.d3'].forEach((s,i)=>{const d=q('.l40 '+s);d.setAttribute('cx',w+5+i*10);d.setAttribute('cy',27)});}

 if(q('.l18')){const t=q('.l18 .w'),a=t.getExtentOfChar(2),b=t.getExtentOfChar(5);q('.l18 .sm').setAttribute('d',`M${a.x} 36 Q${(a.x+b.x+b.width)/2} 48 ${b.x+b.width} 36`);}
}
function replay(el){el.getAnimations({subtree:true}).forEach(a=>{a.cancel();a.play()})}
Promise.all(['800 24px Archivo','24px Allura','600 24px Caveat','24px "Instrument Serif"','italic 24px "Instrument Serif"','500 12px "IBM Plex Mono"','600 24px Fraunces','italic 600 24px Fraunces','800 24px Syne','24px "DM Serif Display"','700 24px "Bricolage Grotesque"','800 24px Unbounded','italic 24px "Playfair Display"','24px Pacifico'].map(f=>document.fonts.load(f))).then(()=>document.fonts.ready).then(()=>{
 const m=document.getElementById('m');
 document.querySelectorAll('#src .card').forEach(s=>{
  const c=document.createElement('div');c.className='c';
  c.innerHTML=`<div class=num>${s.dataset.i}</div><div class=stage><div class=zoom></div></div><div class=bar><nav><span>Work</span><span>About</span><span>Contact</span></nav></div><div class=meta><b>${s.dataset.i}</b>${s.dataset.n}<button>Replay</button></div>`;
  const z=c.querySelector('.zoom'),b=c.querySelector('.bar');
  z.innerHTML=s.innerHTML;b.insertAdjacentHTML('afterbegin',s.innerHTML);
  m.append(c);uniq(z);uniq(b);fit(z);fit(b);
  z.style.setProperty('--z',1);z.getAnimations({subtree:true}).forEach(a=>a.finish());const w=z.firstElementChild.getBoundingClientRect().width;z.style.setProperty('--z',Math.min(2.2,300/w));
  const r=()=>replay(c);c.querySelector('.stage').onclick=r;c.querySelector('.meta button').onclick=r;
 });
 document.getElementById('src').remove();replay(m);document.body.dataset.ok=1;
});
document.getElementById('all').onclick=()=>replay(document.getElementById('m'));
document.querySelectorAll('.sw[data-c]').forEach(b=>b.onclick=()=>document.documentElement.style.setProperty('--a',b.dataset.c));
</script></body></html>
